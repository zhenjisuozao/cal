<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1f2328;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--q1:#ef4444;--q2:#22c55e;--q3:#eab308;--q4:#9ca3af;--now:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1c1f26;--tx:#e8eaed;--sub:#9aa0a6;--line:#2c313a;--pri:#60a5fa}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding-top:env(safe-area-inset-top);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.ro .fab,body.ro [data-act=gedit],body.ro [data-act=gdel],body.ro [data-act=gadd],body.ro [data-act=gp],body.ro [data-act=exp],body.ro [data-act=imp],body.ro [data-act=movetoday],body.ro .gdata{display:none!important}
body.ro .chk{cursor:default;opacity:.7}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:14px 0 6px}
header{padding:18px 18px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:24px;margin:0}.sub{color:var(--sub);font-size:14px}
main{padding:0 14px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.next{background:var(--pri);color:#fff}.next .sub{color:#dbeafe}
.sec{font-size:13px;color:var(--sub);margin:16px 4px 4px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line);position:relative;background:var(--card);transition:opacity .2s,transform .2s;touch-action:pan-y}
.item:last-child{border-bottom:0}
.bar{width:4px;align-self:stretch;border-radius:2px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);flex:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:14px}
.done .chk{background:var(--pri);border-color:var(--pri)}.done .t{text-decoration:line-through;opacity:.5}
.t{flex:1;min-width:0}.meta{font-size:12px;color:var(--sub)}
.overdue{color:var(--q1)}
.tl{position:relative;margin-left:48px;border-left:1px solid var(--line)}
.hr{height:44px;position:relative}.hr span{position:absolute;left:-48px;top:-9px;font-size:11px;color:var(--sub);width:40px;text-align:right}
.ev{position:absolute;left:6px;right:4px;border-radius:8px;padding:4px 8px;font-size:13px;color:#fff;overflow:hidden;cursor:pointer}
.nowl{position:absolute;left:-5px;right:0;height:2px;background:var(--now);z-index:3}.nowl:before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.q{background:var(--card);border-radius:12px;padding:10px;min-height:180px;border-top:4px solid}
.q h3{margin:0 0 6px;font-size:14px}.q .item{min-height:40px;font-size:14px}
.q.over{outline:2px dashed var(--pri)}
.more{font-size:12px;color:var(--pri);cursor:pointer}
.week{display:flex;gap:4px;overflow-x:auto}
.day{flex:1;text-align:center;padding:6px 0;border-radius:10px;cursor:pointer;min-width:42px}
.day.sel{background:var(--pri);color:#fff}.day b{display:block;font-size:18px}
.dots{height:6px}.dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:0 1px;opacity:.6}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.prog>div{height:100%;background:var(--pri)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}

nav button.on{color:var(--pri);font-weight:600}nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:30px;box-shadow:0 4px 12px rgba(37,99,235,.4);z-index:11}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:16px;transform:translateY(100%);transition:transform .2s;z-index:21;max-height:85vh;overflow:auto}
.sheet.open{transform:none}.sheet:not(.open){visibility:hidden;transition:transform .2s,visibility 0s .2s}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);margin:4px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tag{background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:2px 10px;font-size:13px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.qs button{border:2px solid var(--line);background:var(--bg);color:var(--tx);border-radius:10px;padding:8px;font-size:13px}.qs button.on{border-color:currentColor;font-weight:600}
.btn{width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;background:var(--pri);color:#fff;margin-top:8px;min-height:44px}
.btn.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--line)}.btn.red{background:var(--q1)}
.row{display:flex;gap:8px}.row>*{flex:1}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.ghostdrag{position:fixed;pointer-events:none;z-index:30;opacity:.85;background:var(--card);padding:6px 10px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:14px}
.past .chk{background:var(--q4);border-color:var(--q4)}.past .t{opacity:.55}.past .bar{opacity:.4}
.pasttag{color:var(--sub)}
.hrow{display:flex;align-items:center;gap:8px}.hrow h1{flex:1}
.lockbtn{border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}

#savest{font-size:12px;min-height:16px;color:var(--sub)}#savest.err{color:var(--q1)}#savest.ok{color:var(--q2)}
.pwerr{color:var(--q1);font-size:14px;min-height:20px}

.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;width:38px;height:30px;border-radius:7px;color:var(--sub);display:grid;place-items:center;padding:0}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mh{display:flex;align-items:center;gap:6px;margin-bottom:6px}.mh b{flex:1;font-size:19px}
.mh .ar{border:0;background:none;color:var(--pri);font-size:26px;width:36px;height:36px;line-height:1}
.mh .tb{border:1px solid var(--line);background:var(--card);color:var(--pri);border-radius:999px;padding:4px 12px;font-size:13px}
.mwd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--sub);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line)}
.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mc{min-height:84px;border-bottom:1px solid var(--line);padding:4px 2px 3px;overflow:hidden;cursor:pointer;min-width:0}
.mc.out{opacity:.35}.mc.sel{background:rgba(37,99,235,.08);border-radius:6px}
.mc .dn{display:flex;flex-direction:column;align-items:center;line-height:1.1;margin-bottom:1px}
.mc .dn b{font-size:14px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.td .dn b{background:var(--now);color:#fff;font-weight:700}
.mc .dn s{text-decoration:none;font-size:9px;color:var(--sub);white-space:nowrap;min-height:11px}.mc .dn s.hol{color:var(--q1);font-weight:600}.mc .dn s.wrk{color:var(--pri);font-weight:600}
.mc.we .dn b{color:var(--sub)}.mc.td.we .dn b{color:#fff}
.ch{display:flex;align-items:center;gap:3px;font-size:11px;line-height:15px;margin-top:2px;white-space:nowrap;overflow:hidden;border-radius:3px;padding:1px 1px 1px 0;max-width:100%}
.ch i{flex:none;width:4px;height:12px;border-radius:2px}.ch span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ch.fade{opacity:.4}.mmore{font-size:10px;color:var(--sub);padding-left:5px;line-height:14px;margin-top:1px}
</style></head><body>
<header><div class="hrow"><h1 id="ttl">今天</h1><button class="lockbtn" id="lockbtn">🔒 解锁编辑</button></div><div class="sub" id="subt"></div><div id="savest"></div></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="添加">+</button>
<nav id="nav">
<button data-v="today" class="on"><i>☀️</i>今天</button>
<button data-v="quad"><i><svg width="1.2em" height="1.2em" style="display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="8.2" height="8.2" rx="2.2" fill="#ef4444"/><rect x="12.8" y="3" width="8.2" height="8.2" rx="2.2" fill="#22c55e"/><rect x="3" y="12.8" width="8.2" height="8.2" rx="2.2" fill="#eab308"/><rect x="12.8" y="12.8" width="8.2" height="8.2" rx="2.2" fill="#9ca3af"/></svg></i>聚焦</button>
<button data-v="agenda"><i>📅</i>日程</button>
<button data-v="goals"><i>🎯</i>目标</button>
</nav>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<script>
const QN={1:['重要且紧急','--q1'],2:['重要不紧急','--q2'],3:['紧急不重要','--q3'],4:['不重要不紧急','--q4']};
const WD='日一二三四五六';
const $=s=>document.querySelector(s);
const KEY='xd-schedule-v1';
let RO=false,UPD=null;
let S=JSON.parse(localStorage.getItem(KEY)||'null');if(S&&S.rev===undefined)S=null;
if(!S){S={rev:0,tasks:[{id:'seed2',title:'送女儿去名商高尔夫打球',date:'2026-10-18',time:'08:00',q:2,rem:[60],note:'8:00出发，8:30到球场（沙河东路111号）',done:false},{id:'seed1',title:'跟袁灏见面聊天 @MR. WALDEN COFFEE 万象天地',date:'2026-10-18',time:'09:00',q:2,rem:[60],note:'原定10/19 16:00改期；球场过去约3公里、10-15分钟',done:false},{id:'seed3',title:'决定是否让 Grok Bot 重开 iPhone Duo 港深门店盯货',date:'2026-10-22',time:'10:00',q:2,rem:[0],note:'iPhone Duo 10/23 发售，门店可能有现货自提；确认后去主助手聊天说一声',done:false}],goals:[{id:'g1',title:'本季度目标（待填写）',p:0}]};save();}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const fmtD=s=>{const d=pd(s);return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+WD[d.getDay()]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const due=t=>t.date?new Date(pd(t.date).getTime()+(t.time?(+t.time.slice(0,2)*60+ +t.time.slice(3))*6e4:864e5-1)):null;
const isOver=t=>!t.done&&t.date&&!t.time&&due(t)<new Date();
const isPast=t=>!t.done&&t.date&&t.time&&due(t)<new Date();
function remOne(m,t){
  m=Math.round(+m||0);if(m<=0)return '准点';
  // 截止类 / 提前超过半天：若刚好落在当天 dayOfHour，显示「当天 09:00」；短提前提醒不套这个标签
  if(t&&t.time&&m>=720){const[H,Mi]=t.time.split(':').map(Number);let tot=H*60+Mi-m,dayOff=0;while(tot<0){tot+=1440;dayOff--}while(tot>=1440){tot-=1440;dayOff++}
    const rh=Math.floor(tot/60),rmin=tot%60,doh=(RULES.reminder&&RULES.reminder.dayOfHour)||9;
    if(dayOff===0&&rh===doh&&rmin===0)return '当天 '+String(rh).padStart(2,'0')+':00'}
  const nd=Math.round(m/1440);if(nd>=1&&Math.abs(m-nd*1440)<=180)return '提前 '+nd+' 天';
  if(m%60===0){const h=m/60;return (h>=24&&h%24===0)?'提前 '+(h/24)+' 天':'提前 '+h+' 小时'}
  const h=Math.floor(m/60),mm=m%60;if(h>=24){const d=Math.floor(h/24),hh=h%24;return '提前 '+d+' 天'+(hh?' '+hh+' 小时':'')+(mm?' '+mm+' 分':'')}
  if(h)return '提前 '+h+' 小时'+(mm?' '+mm+' 分':'');return '提前 '+mm+' 分钟'}
const remTxt=t=>t.rem&&t.rem.length?'🔔 '+[...t.rem].map(m=>remOne(m,t)).join('、'):'';


// ---- 统一规则（与 Python schedlib.py 共用 rules.json；这里内置一份默认值，加载时以线上 rules.json 为准）----
let RULES={"_说明": "日程规则的唯一定义。validate.py / due_reminders.py / make_ics.py（经 schedlib.py）和网页 index.html 都读这一份。改规则只改这里。", "quadrants": {"1": "重要且紧急", "2": "重要不紧急", "3": "紧急不重要", "4": "不重要不紧急"}, "duration": {"defaultMin": 60, "notePattern": "时长\\s*(\\d+(?:\\.\\d+)?)\\s*(分钟|分|小时|h)"}, "conflict": {"severity": "冲突"}, "near": {"gapMin": 30}, "lateNight": {"fromHour": 0, "toHour": 6}, "duplicate": {"similarity": 0.7}, "deadline": {"titleMarker": "（截止）", "noteMarker": "产品类", "escalateHours": 48, "workloadPattern": "工作量\\s*(\\d+(?:\\.\\d+)?)\\s*小时", "workloadFactor": 2}, "reminder": {"defaultLeadMin": 60, "none": "无提醒", "onTime": "准点", "leadPattern": "提前\\s*(\\d+(?:\\.\\d+)?)\\s*(分钟|分|小时)", "quietFromHour": 23, "quietToHour": 8, "quietMoveToHour": 22, "dayOfHour": 9, "finalLeadMin": 60}, "dashboardUrl": "https://zhenjisuozao.github.io/cal/653744dd8e57200a0666cdc5/"};
fetch('rules.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j){RULES=j;render()}}).catch(()=>{});
const tStart=t=>t.date?new Date(pd(t.date).getTime()+(t.time?(+t.time.slice(0,2)*60+ +t.time.slice(3))*6e4:0)):null;
const isDL=t=>(t.title||'').includes(RULES.deadline.titleMarker)||(t.note||'').includes(RULES.deadline.noteMarker);
const tLoc=t=>(t.title||'').includes('@')?t.title.split('@').slice(1).join('@').trim():'';
function durMin(t){if(isDL(t))return 0;const m=(t.note||'').match(new RegExp(RULES.duration.notePattern));return m?+m[1]*(/小时|h/.test(m[2])?60:1):RULES.duration.defaultMin}
function escAt(t){if(!isDL(t)||!t.date||!t.time)return null;const D=RULES.deadline,due=tStart(t);let x=due.getTime()-D.escalateHours*36e5;const m=(t.note||'').match(new RegExp(D.workloadPattern));if(m)x=Math.min(x,due.getTime()-(+m[1])*D.workloadFactor*36e5);return new Date(x)}
const EQ=(t,now=new Date())=>{if(t.done)return t.q;const e=escAt(t);return e&&now>=e?1:t.q};
const normT=s=>(s||'').split(RULES.deadline.titleMarker).join('').replace(/[\s（）()@·,，。:：]/g,'').toLowerCase();
function dice(a,b){a=normT(a);b=normT(b);if(a===b)return 1;const A=[],B={};for(let i=0;i<a.length-1;i++)A.push(a.slice(i,i+2));let nb=0;for(let i=0;i<b.length-1;i++){const g=b.slice(i,i+2);B[g]=(B[g]||0)+1;nb++}if(!A.length||!nb)return 0;let c=0;for(const g of A)if(B[g]>0){B[g]--;c++}return 2*c/(A.length+nb)}
const fmtT=t=>(t.date?t.date.slice(5).replace('-','/'):'')+' '+(t.time||'')+' '+t.title;
function checkTask(n,all,now=new Date()){const out=[];if(n.done||!n.date)return out;const ns=tStart(n);
  if(n.time&&ns<now)out.push({type:'past',level:'error',msg:'时间已过：'+fmtT(n)+' 早于现在'});
  if(!n.time&&n.date<today())out.push({type:'past',level:'error',msg:'日期已过：'+fmtT(n)});
  const L=RULES.lateNight;if(n.time){const h=+n.time.slice(0,2);if(h>=L.fromHour&&h<L.toHour)out.push({type:'latenight',level:'warn',msg:'深夜时间 '+n.time+'，是不是上下午弄反了？'})}
  for(const o of all){if(o.id===n.id||o.done||!o.date)continue;
    if(o.date===n.date&&dice(o.title,n.title)>=RULES.duplicate.similarity)out.push({type:'duplicate',level:'warn',with:o,msg:'可能重复：同一天已有「'+fmtT(o)+'」'});
    if(!n.time||!o.time)continue;const dn=durMin(n),dO=durMin(o);if(!dn||!dO)continue;
    const os=tStart(o),ne=ns.getTime()+dn*6e4,oe=os.getTime()+dO*6e4;
    if(ns<oe&&os<ne){out.push({type:'conflict',level:'error',with:o,msg:'时间冲突：与「'+fmtT(o)+'」（'+dO+'分钟）重叠'});continue}
    const gap=(ns>=oe?ns-oe:os-ne)/6e4,ln=tLoc(n),lo=tLoc(o);
    if(ln&&lo&&ln!==lo&&gap<RULES.near.gapMin)out.push({type:'near',level:'warn',with:o,msg:'太近：与「'+fmtT(o)+'」只隔 '+Math.round(gap)+' 分钟，地点不同（'+ln+' / '+lo+'），注意路程'})}
  return out}
window.checkTask=checkTask;window.EQ=EQ;
// ---- 中文自然语言解析 ----
const CN={'零':0,'〇':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function cn2n(s){if(/^\d+$/.test(s))return+s;if(s==='半')return 30;let n=0,t=0;for(const c of s){const v=CN[c];if(v===10){n+=(t||1)*10;t=0}else t=v}return n+t}
const NUM='[\\d零〇一二两三四五六七八九十]+';
function parse(text,now=new Date()){
  let s=text,date=null,time=null,hit=[];
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const add=n=>{const d=new Date(base);d.setDate(d.getDate()+n);return d};
  let m;
  const rel={'今天':0,'今日':0,'明天':1,'明日':1,'后天':2,'大后天':3};
  if(m=s.match(/大后天|今天|今日|明天|明日|后天/)){date=add(rel[m[0]]);hit.push(m[0]);s=s.replace(m[0],' ')}
  else if(m=s.match(/(下下|下|这|本)?(?:周|星期|礼拜)([一二三四五六日天1-7])/)){
    let w='日天1234567'.includes(m[2])&&/\d/.test(m[2])?+m[2]%7:('日天'.includes(m[2])?0:CN[m[2]]);
    const cur=(base.getDay()+6)%7, tgt=(w+6)%7; // 周一=0
    let off=tgt-cur;
    if(m[1]==='下')off+=7;else if(m[1]==='下下')off+=14;else if(!m[1]&&off<0)off+=7;
    date=add(off);hit.push(m[0]);s=s.replace(m[0],' ')}
  else if(m=s.match(new RegExp('(?:('+NUM+')年)?('+NUM+')月('+NUM+')[日号]?'))){
    const y=m[1]?cn2n(m[1]):base.getFullYear();let d=new Date(y<100?2000+y:y,cn2n(m[2])-1,cn2n(m[3]));
    if(!m[1]&&d<base)d.setFullYear(d.getFullYear()+1);date=d;hit.push(m[0]);s=s.replace(m[0],' ')}
  else if(m=s.match(/(\d{1,2})[\/.](\d{1,2})(?!\d)/)){let d=new Date(base.getFullYear(),m[1]-1,+m[2]);if(d<base)d.setFullYear(d.getFullYear()+1);date=d;hit.push(m[0]);s=s.replace(m[0],' ')}

  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv)},k,b64d(E.ct));return new TextDecoder().decode(pt)}
function askUnlock(){openSheet(`<h3 style="margin:0 0 6px">解锁编辑</h3><div class="sub">输入修改密码。这台设备会记住，以后不用再输。</div>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="修改密码">
  <div class="pwerr" id="pwerr"></div><button class="btn" id="pwok">解锁</button><button class="btn ghost" onclick="closeSheet()">取消</button>`);
  setTimeout(()=>$('#pw').focus(),250);
  const go=async()=>{const pw=$('#pw').value.trim().toLowerCase();if(!pw){$('#pwerr').textContent='请输入密码';return}
    $('#pwok').disabled=true;$('#pwok').textContent='验证中…';$('#pwerr').textContent='';
    try{const tok=await unlockWith(pw);TOKEN=tok;localStorage.setItem(TKEY,tok);applyMode();closeSheet();status('已解锁，可以直接修改','ok');pull();render()}
    catch(e){$('#pwerr').textContent=e&&e.name==='OperationError'?'密码不对，请再试一次':'解锁失败，请检查网络后重试';$('#pwok').disabled=false;$('#pwok').textContent='解锁'}};
  $('#pwok').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}}
function lockOut(msg){TOKEN=null;localStorage.removeItem(TKEY);applyMode();render();if(msg)status(msg,'err')}
$('#lockbtn').onclick=()=>{if(RO)askUnlock();else if(confirm('退出编辑？这台设备会忘掉密码，之后只能查看。'))lockOut()};
async function gh(path,opt={}){const r=await fetch(path.startsWith('http')?path:API+path,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401||r.status===403&&!(await r.clone().text()).includes('rate')){const e=new Error('auth');e.auth=true;throw e}
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}return r.json()}
async function ghFile(ref){const j=await gh(`/contents/${SLUG}/data.json?ref=${ref||BR}&t=${Date.now()}`);
  return{data:JSON.parse(new TextDecoder().decode(b64d(j.content.replace(/\s/g,'')))),sha:j.sha}}
// 与 make_ics.py 一致的 ICS 生成
const icsEsc=s=>s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function fold(line){let b=new TextEncoder().encode(line);const out=[];while(b.length>75){let i=out.length?74:75;while((b[i]&0xC0)===0x80)i--;out.push(b.slice(0,i));b=b.slice(i)}out.push(b);return out.map(x=>new TextDecoder().decode(x)).join('\r\n ')}
async function sha1hex(s){return [...new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ymd=s=>s.replace(/-/g,'');
function nextDay(s){const d=pd(s);d.setDate(d.getDate()+1);return ds(d)}
function addHour(date,time){const h=+time.slice(0,2)+1;return h>=24?[nextDay(date),pad(h-24)+time.slice(3)]:[date,pad(h)+time.slice(3)]}
async function buildIcs(tasks){const ev=[];for(const t of tasks){if(!t.date)continue;let loc='';const lm=(t.note||'').match(/地点[:：]\s*([^；;]+)/);if(lm)loc=lm[1].replace(/\(.*?\)|（.*?）/g,'').trim();
    ev.push({...t,quad:QN[EQ(t)]?QN[EQ(t)][0]:'',eq:EQ(t),loc,uid:(await sha1hex(t.title)).slice(0,16)+'@xiaodun-schedule',key:t.date+(t.time||'00:00')})}
  ev.sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const hex=s=>[...new TextEncoder().encode(s)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);
  const cal=(E,name)=>{const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Xiaodun//Schedule Reminder//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(name),'X-WR-TIMEZONE:Asia/Shanghai','REFRESH-INTERVAL;VALUE=DURATION:PT15M','X-PUBLISHED-TTL:PT15M','BEGIN:VTIMEZONE','TZID:Asia/Shanghai','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:CST','END:STANDARD','END:VTIMEZONE'];
    for(const e of E){const desc='象限：'+e.quad+(e.note?'\n备注：'+e.note:'');L.push('BEGIN:VEVENT','UID:'+e.uid,'DTSTAMP:'+now);
      if(e.time){const[ed,et]=addHour(e.date,e.time);L.push(`DTSTART;TZID=Asia/Shanghai:${ymd(e.date)}T${e.time.replace(':','')}00`,`DTEND;TZID=Asia/Shanghai:${ymd(ed)}T${et.replace(':','')}00`)}
      else L.push('DTSTART;VALUE=DATE:'+ymd(e.date),'DTEND;VALUE=DATE:'+ymd(nextDay(e.date)));
      L.push('SUMMARY:'+icsEsc((e.done?'✅ ':'')+e.title),'DESCRIPTION:'+icsEsc(desc));if(e.loc)L.push('LOCATION:'+icsEsc(e.loc));if(e.quad)L.push('CATEGORIES:'+icsEsc(e.quad));
      if(!e.done&&e.time)for(const m of (e.rem||[]))L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+(m>=0?'-':'')+'PT'+Math.abs(Math.round(m))+'M','END:VALARM');L.push('END:VEVENT')}
    if(!E.length)L.push('BEGIN:VEVENT',`UID:placeholder-${hex(name)}@xd`,'DTSTAMP:'+now,'DTSTART;VALUE=DATE:20000101','DTEND;VALUE=DATE:20000102','SUMMARY:（占位）','TRANSP:TRANSPARENT','END:VEVENT');
    L.push('END:VCALENDAR');return L.map(fold).join('\r\n')+'\r\n'};
  const F={'all.ics':cal(ev,'日程提醒')};for(const q of [1,2,3,4])F[`q${q}.ics`]=cal(ev.filter(e=>e.eq===q),'日程提醒·'+QN[q][0]);return F}
window.buildIcs=buildIcs;
function bjISO(){const d=new Date(Date.now()+8*36e5);return d.toISOString().slice(0,19)+'+08:00'}
// 所有写入都经过 commit；这里统一校验（新增/编辑/拖动/右滑改到明天/逾期挪到今天…）
function changedTasks(before,after){const m={};before.forEach(t=>m[t.id]=t);return after.filter(t=>{const b=m[t.id];return !t.done&&(!b||b.date!==t.date||b.time!==t.time||b.title!==t.title||(b.done&&!t.done))})}
function conflictDialog(list,onSave,onEdit){const rows=list.map(({t,iss})=>`<div style="margin:8px 0"><b>${esc(fmtT(t))}</b>${iss.map(i=>`<div class="sub" style="color:${i.level==='error'?'var(--q1)':'var(--q3)'};margin-top:3px">${i.level==='error'?'⛔':'⚠️'} ${esc(i.msg)}</div>`).join('')}</div>`).join('');
  openSheet(`<h3 style="margin:0 0 4px">保存前请确认</h3><div class="sub">这次修改有下面的问题：</div>${rows}
  <button class="btn" id="cf-save">仍然保存</button><div class="row"><button class="btn ghost" id="cf-edit">改时间</button><button class="btn ghost" id="cf-cancel">取消</button></div>`);
  $('#cf-save').onclick=()=>{closeSheet();onSave()};$('#cf-edit').onclick=()=>{closeSheet();onEdit()};$('#cf-cancel').onclick=()=>{closeSheet();render();status('已取消，未保存')}}
function commit(op,msg,opt={}){if(!TOKEN){askUnlock();return}
  const loc=JSON.parse(JSON.stringify(S));op(loc);
  if(!opt.force){const list=changedTasks(S.tasks,loc.tasks).map(t=>({t,iss:checkTask(t,loc.tasks)})).filter(x=>x.iss.length);
    if(list.length){window.__lastCheck=list;conflictDialog(list,()=>commit(op,msg,{force:true}),()=>{const t=list[0].t;const isNew=!S.tasks.some(x=>x.id===t.id);form(t,isNew)});return}}S.tasks=loc.tasks;S.goals=loc.goals;render(); // 本地立即更新
  QUEUE=QUEUE.then(()=>push(op,msg));return QUEUE}
async function push(op,msg){SAVING=true;status('保存中…');
  try{for(let n=0;n<5;n++){
      const ref=await gh(`/git/ref/heads/${BR}?t=${Date.now()}`),head=ref.object.sha;
      const {data:d}=await ghFile(head);d.tasks=d.tasks||[];d.goals=d.goals||[];op(d);
      d.rev=(d.rev||0)+1;d.source='web';d.updatedAt=bjISO();
      d.tasks.sort((a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')));
      const files={'data.json':JSON.stringify({rev:d.rev,source:d.source,updatedAt:d.updatedAt,tasks:d.tasks,goals:d.goals},null,1),...await buildIcs(d.tasks)};
      const hc=await gh(`/git/commits/${head}`);
      const tree=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:hc.tree.sha,tree:Object.entries(files).map(([k,v])=>({path:SLUG+'/'+k,mode:'100644',type:'blob',content:v}))})});
      const c=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:'网页修改：'+(msg||'')+' (rev '+d.rev+')',tree:tree.sha,parents:[head]})});
      try{await gh(`/git/refs/heads/${BR}`,{method:'PATCH',body:JSON.stringify({sha:c.sha,force:false})})}
      catch(e){if(e.status===422||e.status===409){await new Promise(r=>setTimeout(r,600*(n+1)));continue}throw e}
      setData(d);SAVING=false;status('已保存','ok');if(!$('#sheet').classList.contains('open'))render();window.__lastSave={rev:d.rev,commit:c.sha};return}
    throw new Error('conflict')}
  catch(e){SAVING=false;if(e.auth){lockOut('保存失败：编辑钥匙已失效，请重新解锁');}else status(e.message==='conflict'?'保存失败：多处同时修改，请刷新后重试':'保存失败：网络或 GitHub 出错，请稍后重试','err');window.__lastSave={err:String(e)};pull()}}
